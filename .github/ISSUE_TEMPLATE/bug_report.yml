name: Bug report
description: Report a reproducible problem with a skill, installer, or check.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include secrets, private project data, or vulnerability details in a public issue. For security issues, use the private reporting link on the new issue page.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: What is affected?
      options:
        - frontend-design skill
        - Agent workflow skills (orchestration, planning, execution, review, etc.)
        - Antigravity installer
        - OpenCode installer
        - Validation or contrast script
        - Documentation
        - CI or repository configuration
        - Other
    validations:
      required: true

  - type: input
    id: harness
    attributes:
      label: Agent or harness
      description: Which agent and version are you using?
      placeholder: Antigravity (App/CLI/IDE), OpenCode 2.x, Claude Code, Codex, other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps, command, prompt, or repository that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Ask ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node, git, and any relevant version output.
      placeholder: |
        OS:
        Python:
        Node:
        Antigravity / OpenCode:
        Commit:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact secrets and private data before pasting.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This report does not contain secrets or private data.
          required: true
        - label: This is not a security vulnerability (those go through private reporting).
          required: true
